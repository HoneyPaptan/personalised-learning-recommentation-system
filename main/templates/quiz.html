<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - MathMaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .quiz-stats {
            display: flex;
            gap: 1.5rem;
        }
        .quiz-stat {
            text-align: center;
        }
        .quiz-stat-value {
            font-size: 1.125rem;
            font-weight: 700;
        }
        .quiz-stat-label {
            font-size: 0.625rem;
            color: var(--muted-foreground);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 500;
        }
        .ai-message-container {
            margin-bottom: 1.5rem;
            max-height: 60px;
            overflow: hidden;
        }
        .ai-message-container.hidden {
            max-height: 0;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    MathMaster
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    Dashboard
                </a>
                <a href="/quiz" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                    </svg>
                    Quiz
                </a>
                <a href="/profile" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Profile
                </a>
                <a href="/settings" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    Settings
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar">
                        {{ user_name[:1]|upper }}
                    </div>
                    <div class="user-info">
                        <div class="user-name">{{ user_name }}</div>
                        <div class="user-role">Student</div>
                    </div>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <a href="/dashboard" style="display: flex; align-items: center; gap: 0.5rem; color: var(--muted-foreground);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                        <span class="breadcrumb">Back</span>
                    </a>
                </div>
                <div class="header-right">
                    <button class="header-btn" id="end-session-btn" title="End Session">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </header>
            
            <div class="page-content">
                <div class="quiz-header">
                    <div>
                        <h1 class="page-title">Practice Quiz</h1>
                        <p class="page-subtitle">Test your math skills</p>
                    </div>
                    <div class="quiz-stats">
                        <div class="quiz-stat">
                            <div class="quiz-stat-value" id="mastery-display">0%</div>
                            <div class="quiz-stat-label">Mastery</div>
                        </div>
                        <div class="quiz-stat">
                            <div class="quiz-stat-value" id="skill-display">{{ question.skill }}</div>
                            <div class="quiz-stat-label">Skill</div>
                        </div>
                    </div>
                </div>
                
                {% if ai_avatar_enabled %}
                <div class="ai-message-container {% if not ai_avatar_enabled %}hidden{% endif %}" id="ai-message-container">
                    <div class="ai-avatar">
                        <div class="ai-avatar-icon">✨</div>
                        <div class="ai-avatar-text">
                            <div class="ai-avatar-message" id="ai-message">Take a deep breath. You've got this!</div>
                        </div>
                    </div>
                </div>
                {% endif %}
                
                <div class="quiz-container">
                    <div class="question-card">
                        <div class="question-text" id="question-text">
                            {{ question.question }}
                        </div>
                        
                        <div style="max-width: 200px; margin: 0 auto;">
                            <input 
                                type="number" 
                                class="input" 
                                id="answer-input"
                                placeholder="? = answer"
                                autocomplete="off"
                                style="text-align: center; font-size: 1.25rem; padding: 0.75rem;"
                                onkeypress="if(event.key === 'Enter') submitAnswer();"
                            >
                        </div>
                        
                        <button 
                            type="button"
                            class="btn btn-primary" 
                            style="display: block; margin: 1rem auto 0; min-width: 140px;"
                            onclick="submitAnswer()"
                        >
                            Submit
                        </button>
                    </div>
                    
                    <div class="feedback-card hidden" id="feedback-card">
                        <div class="feedback-label" id="feedback-label">Feedback</div>
                        <div class="feedback-text" id="feedback-text"></div>
                    </div>
                    
                    <div style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.25rem;">
                        <button class="btn btn-primary btn-lg" id="next-btn" onclick="loadNextQuestion()" style="display: none;">
                            Next Question
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        let questionStartTime = null;
        let hasSubmitted = false;
        let currentQuestion = {{ question | tojson }};
        let mastery = 50;
        let aiEnabled = {{ 'true' if ai_avatar_enabled else 'false' }};
        
        function submitAnswer() {
            if (hasSubmitted) return;
            
            const input = document.getElementById('answer-input');
            const answer = parseFloat(input.value.trim());
            
            if (isNaN(answer)) {
                input.focus();
                return;
            }
            
            hasSubmitted = true;
            questionStartTime = Date.now();
            
            const endTime = Date.now();
            const responseTime = (endTime - questionStartTime) / 1000;
            
            const correctAnswer = parseFloat(currentQuestion.answer);
            const isCorrect = answer === correctAnswer;
            const score = isCorrect ? 1 : 0;
            
            console.log('Submitting:', { answer, correctAnswer, isCorrect, responseTime });
            
            if (score === 1) {
                input.style.background = 'rgba(16, 185, 129, 0.15)';
                input.style.borderColor = '#10b981';
            } else {
                input.style.background = 'rgba(239, 68, 68, 0.15)';
                input.style.borderColor = '#ef4444';
                input.value = currentQuestion.answer;
            }
            
            console.log('Sending to backend:', {
                score: score,
                response_time: responseTime,
                skill: currentQuestion.skill,
                question_text: currentQuestion.question
            });
            
            fetch('/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    score: score,
                    response_time: responseTime,
                    skill: currentQuestion.skill,
                    question_text: currentQuestion.question
                })
            })
            .then(res => {
                console.log('Response status:', res.status);
                return res.json();
            })
            .then(data => {
                console.log('Response data:', data);
                mastery = data.mastery * 100;
                document.getElementById('mastery-display').textContent = mastery + '%';
                document.getElementById('skill-display').textContent = currentQuestion.skill;
                
                const feedbackCard = document.getElementById('feedback-card');
                const feedbackLabel = document.getElementById('feedback-label');
                const feedbackText = document.getElementById('feedback-text');
                
                feedbackCard.classList.remove('hidden');
                feedbackCard.classList.remove('success', 'slip', 'gap');
                
                if (data.is_slip) {
                    feedbackCard.classList.add('slip');
                    feedbackLabel.textContent = 'Slip Detected';
                } else if (score === 1) {
                    feedbackCard.classList.add('success');
                    feedbackLabel.textContent = 'Correct';
                } else {
                    feedbackCard.classList.add('gap');
                    feedbackLabel.textContent = 'Keep Trying';
                }
                
                feedbackText.textContent = data.feedback;
                
                if (aiEnabled && data.ai_message) {
                    document.getElementById('ai-message').textContent = data.ai_message;
                    document.getElementById('ai-message-container').classList.remove('hidden');
                }
                
                document.getElementById('next-btn').style.display = 'inline-flex';
            })
            .catch(err => {
                console.error('Error:', err);
            });
        }
        
        function loadNextQuestion() {
            fetch('/question')
            .then(res => res.json())
            .then(data => {
                currentQuestion = data;
                hasSubmitted = false;
                questionStartTime = null;
                
                document.getElementById('question-text').textContent = data.question;
                document.getElementById('answer-input').value = '';
                document.getElementById('answer-input').style.background = '';
                document.getElementById('answer-input').style.borderColor = '';
                document.getElementById('answer-input').disabled = false;
                document.getElementById('answer-input').focus();
                
                document.getElementById('feedback-card').classList.add('hidden');
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('ai-message-container').classList.add('hidden');
            });
        }
        
        document.getElementById('answer-input').addEventListener('input', () => {
            if (!questionStartTime && !hasSubmitted) {
                questionStartTime = Date.now();
            }
        });
        
        document.getElementById('end-session-btn').addEventListener('click', () => {
            if (confirm('End this session?')) {
                fetch('/end-session', { method: 'POST' })
                .then(() => window.location.href = '/dashboard');
            }
        });
        
        document.getElementById('answer-input').focus();
    </script>
</body>
</html>
